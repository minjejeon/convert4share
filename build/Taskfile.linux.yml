version: '3'

includes:
  common: Taskfile.common.yml

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:build:frontend
      - task: build:c4s
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}} ./cmd/convert4share

  build:c4s:
    summary: Builds the minimal C trampoline for Linux
    cmds:
      - '{{.CC | default "gcc"}} -O2 -s -o {{.BIN_DIR}}/c4s ./cmd/c4s/main.c'
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -ldflags="-w -s"{{else}}-gcflags=all="-l"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build into a Linux package via nfpm
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    preconditions:
      - sh: command -v nfpm
        msg: "nfpm isn't on PATH. Install it with: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest"
    cmds:
      # Produce a .deb. For other formats swap --packager: rpm, archlinux.
      - nfpm pkg --config build/linux/nfpm/nfpm.yaml --packager deb --target {{.BIN_DIR}}/

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
