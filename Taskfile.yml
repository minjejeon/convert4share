version: '3'

includes:
  common: ./build/Taskfile.common.yml
  windows: ./build/Taskfile.windows.yml
  linux: ./build/Taskfile.linux.yml

vars:
  APP_NAME: "convert4share"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  generate:bindings:
    summary: Regenerates frontend bindings from Go services
    cmds:
      - task: common:generate:bindings

  release:
    summary: Builds and creates a release zip
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "Compress-Archive -Path {{.BIN_DIR}}/{{.APP_NAME}}.exe -DestinationPath {{.BIN_DIR}}/{{.APP_NAME}}-windows-amd64.zip -Force"{{else}}tar czf {{.BIN_DIR}}/{{.APP_NAME}}-linux-{{ARCH}}.tar.gz -C {{.BIN_DIR}} {{.APP_NAME}}{{end}}'

  clean:
    summary: Removes build artifacts
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "Remove-Item -Recurse -Force {{.BIN_DIR}}, cmd/convert4share/dist, frontend/dist, frontend/src/bindings -ErrorAction SilentlyContinue"{{else}}rm -rf {{.BIN_DIR}} cmd/convert4share/dist frontend/dist frontend/src/bindings{{end}}'
